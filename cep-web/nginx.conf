# ============================================================
# CEP Event Console - Nginx configuration (TLS enabled)
# ============================================================
# Serves the built frontend (cep-web/) over HTTPS and reverse-proxies
# /api to the cep-engine backend, avoiding CORS in production.
#
# A self-signed certificate is bundled in deploy/tls/ for development
# and internal deployments. For production, replace with a CA-signed cert.
#
# USAGE - two ways:
#
#   (A) Run as a STANDALONE main config (self-contained):
#       nginx -c /cpcnet/cep/cep-engine-1.0.0/nginx.conf
#       Edit FRONTEND_ROOT, BACKEND_UPSTREAM, and TLS cert paths below.
#
#   (B) Use as a server-block snippet in a system nginx:
#       Copy ONLY the "server { ... }" blocks into /etc/nginx/conf.d/cep-web.conf
#       and reload nginx (the system main nginx.conf already provides the
#       http/events context). In this case ignore the events/http wrapper.
# ============================================================

# ---- Standalone main-config settings (used only when running with -c) ----
worker_processes auto;
pid /var/run/nginx-cep.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;   # adjust to your nginx mime.types path
    default_type  application/octet-stream;
    sendfile      on;

    # ---- Temporary dirs (standalone mode) ----
    client_body_temp_path  /tmp/nginx-cep/client_temp;
    proxy_temp_path        /tmp/nginx-cep/proxy_temp;
    fastcgi_temp_path      /tmp/nginx-cep/fastcgi_temp;
    uwsgi_temp_path        /tmp/nginx-cep/uwsgi_temp;
    scgi_temp_path         /tmp/nginx-cep/scgi_temp;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- HTTP → HTTPS redirect ----
    server {
        listen 9988;
        server_name _;
        return 301 https://$host:9443$request_uri;
    }

    # ---- HTTPS server ----
    server {
        listen 9443 ssl;
        server_name _;

        # ---- TLS certificate ----
        # Self-signed cert for dev/internal (10-year validity).
        # Replace with CA-signed cert for production.
        ssl_certificate     /cpcnet/cep/frontend/deploy/tls/self-signed.crt;
        ssl_certificate_key /cpcnet/cep/frontend/deploy/tls/self-signed.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- Editable for your environment ----
        set $frontend_root "/cpcnet/cep/frontend";
        set $backend_upstream "127.0.0.1:9980";

        # Frontend static assets
        root  $frontend_root;
        index index.html;

        # ---- HTTP security response headers ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # SPA history mode: fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static asset caching
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Reverse proxy for the backend API
        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin             "";

            # WebSocket support if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeout for batch operations
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
