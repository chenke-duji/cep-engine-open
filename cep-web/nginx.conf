# ============================================================
# Nginx config for CEP Event Console
#
# Serves the built frontend (dist/) and reverse-proxies /api to the
# cep-engine backend, avoiding CORS in production.
#
# Typical location: /etc/nginx/conf.d/cep-web.conf
# Replace the placeholder upstream address with the actual cep-engine host.
# ============================================================

server {
    listen       80;
    server_name  _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Frontend static assets
    root  /usr/share/nginx/html;
    index index.html;

    # SPA history mode: fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Reverse proxy for the backend API
    location /api/ {
        proxy_pass http://cep-engine:8080;   # <-- change to backend host:port
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout for batch operations
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
