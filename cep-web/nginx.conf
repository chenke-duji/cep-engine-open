# ============================================================
# CEP Event Console - Nginx configuration
# ============================================================
# Serves the built frontend (cep-web/) and reverse-proxies /api to the
# cep-engine backend, avoiding CORS in production.
#
# USAGE - two ways:
#
#   (A) Run as a STANDALONE main config (self-contained):
#       nginx -c /cpcnet/cep/cep-engine-1.0.0/nginx.conf
#       Edit FRONTEND_ROOT and BACKEND_UPSTREAM below for your environment.
#
#   (B) Use as a server-block snippet in a system nginx:
#       Copy ONLY the "server { ... }" block into /etc/nginx/conf.d/cep-web.conf
#       and reload nginx (the system main nginx.conf already provides the
#       http/events context). In this case ignore the events/http wrapper.
# ============================================================

# ---- Standalone main-config settings (used only when running with -c) ----
worker_processes auto;
pid /var/run/nginx-cep.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;   # adjust to your nginx mime.types path
    default_type  application/octet-stream;
    sendfile      on;

    # ---- Temporary dirs (standalone mode) ----
    # Avoid the default /var/cache/nginx which may not exist. /tmp is always
    # writable; nginx creates these single-level dirs under /tmp.
    client_body_temp_path  /tmp/nginx-cep/client_temp;
    proxy_temp_path        /tmp/nginx-cep/proxy_temp;
    fastcgi_temp_path      /tmp/nginx-cep/fastcgi_temp;
    uwsgi_temp_path        /tmp/nginx-cep/uwsgi_temp;
    scgi_temp_path         /tmp/nginx-cep/scgi_temp;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  _;

        # ---- Editable for your environment ----
        # Directory containing the built frontend (index.html + assets/).
        set $frontend_root "/cpcnet/cep/cep-engine-1.0.0/cep-web";
        # Backend upstream (cep-engine host:port).
        set $backend_upstream "127.0.0.1:8080";

        # Frontend static assets
        root  $frontend_root;
        index index.html;

        # SPA history mode: fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static asset caching
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Reverse proxy for the backend API
        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeout for batch operations
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
