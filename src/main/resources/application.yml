# ============================================
# CEP Event Engine - Application Configuration
# ============================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: cep-engine

  # MongoDB - sole persistence layer (required for startup)
  # Auth can be provided either in the URI (mongodb://user:pass@host/db?authSource=admin)
  # or via the username/password/authentication-database fields below.
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cep}
      database: ${MONGO_DATABASE:cep}
      # Leave blank when MongoDB has no auth. Note: do NOT use "${MONGO_USERNAME:}"
      # here — Spring Boot binds the empty placeholder to a char[] and fails with
      # an NPE on startup. Set values (or MONGO_USERNAME/MONGO_PASSWORD env) only
      # when auth is enabled.
      username:
      password:
      # Auth source database (usually "admin"); only needed when username is set.
      authentication-database: ${MONGO_AUTH_DB:admin}
      auto-index-creation: true

  # Virtual threads (Java 21)
  threads:
    virtual:
      enabled: true

  # Kafka (optional - disabled by default)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cep-engine
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500

# ============================================
# CEP Engine Custom Configuration
# ============================================
cep:
  # Groovy script engine
  groovy:
    script-dir: ./conf/groovy
    file-watch:
      enabled: true
      debounce-ms: 1000

  # MongoDB batch writer
  mongo:
    batch-writer:
      flush-interval-ms: 500
    # Event history: resolved events (Cleared Problems / Resolution) are kept
    # in events_current for the retention window, then moved to events_history.
    history:
      # How long a resolved event stays in events_current before moving to history (ms).
      retention-ms: 300000
      # How often the cleanup task scans for events to move to history (ms).
      cleanup-interval-ms: 30000

  # Kafka consumer (optional)
  kafka:
    enabled: false
    topic: cep-raw-events
    group-id: cep-engine
    concurrency: 3

  # Domain processing
  domain:
    # Stale problem cleanup interval (ms)
    cleanup-interval-ms: 300000
    # Problem timeout (ms) - events older than this are considered stale
    problem-timeout-ms: 86400000

  # Event processing
  processing:
    # Max events processed concurrently per domain
    concurrency-per-domain: 100

  # Transport-level deduplication (Active-Active collector support)
  transport-dedup:
    enabled: true
    # Fingerprint TTL in milliseconds (how long a fingerprint is remembered)
    ttl-ms: 10000
    # Cleanup interval for expired fingerprints
    cleanup-interval-ms: 30000

  # CORS: comma-separated list of allowed frontend origins. Leave empty for
  # same-origin only (recommended in production behind a reverse proxy).
  cors:
    allowed-origins: ${CEP_CORS_ALLOWED_ORIGINS:}

# ============================================
# Security (login authentication)
# ============================================
  security:
    jwt:
      # Secret key for JWT signing. MUST be changed in production (>= 32 chars).
      # Supports env override via CEP_JWT_SECRET.
      secret: ${CEP_JWT_SECRET:cep-engine-please-change-this-secret-key-0123456789abcdef}
      # Token validity in milliseconds (default 8 hours)
      expiration-ms: ${CEP_JWT_EXPIRATION_MS:28800000}
      # Token issuer
      issuer: cep-engine
    bootstrap-admin:
      # Initial admin account created on first startup if users collection is empty.
      # SEC-05: no weak default password. If unset, a random password is generated
      # and printed to the log on first bootstrap.
      username: ${CEP_ADMIN_USER:admin}
      password: ${CEP_ADMIN_PASSWORD:}
      display-name: Administrator

  # ============================================
  # Predefined MongoDB update operations (right-click context menu)
  # ============================================
  operations:
    - name: ack
      menuLabel: "确认 (Acknowledge)"
      confirmMessage: "确认将这些事件标记为已确认 (Acked) ？"
      collection: events_current
      # MongoDB update document applied to the selected events
      update:
        status: Acked
    - name: clear
      menuLabel: "清除 (Clear)"
      confirmMessage: "确认清除这些事件 (Cleared) ？"
      collection: events_current
      update:
        status: Cleared

# ============================================
# Actuator / Health
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ============================================
# Logging
# ============================================
logging:
  level:
    com.raysdata.cep: INFO
    org.springframework.data.mongodb: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
